version: "3.9"

services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    # En desarrollo: monta el código para hot-reload
    volumes:
      - .:/app:delegated
    # Usa el comando de dev con --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Perfil de desarrollo
    profiles: ["dev"]

  api-prod:
    build:
      context: .
    env_file: .env
    ports:
      - "8000:8000"
    # Sin volumenes ni reload en prod; usa CMD del Dockerfile
    profiles: ["prod"]
